name = "the-deangelo-series"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "deangelo-series-orders"
database_id = "89676fb8-49c5-4824-9b1c-3dacc59c0455"

# Same non-inheritance problem as [env.X.vars] below, but for bindings: once
# an [env.production]/[env.preview] section exists at all, the top-level
# [[d1_databases]] stops applying to those environments too — not just vars.
# Confirmed live on 2026-08-14: a real Stripe checkout.session.completed
# webhook failed with "Missing D1 binding: DB" in Production because of
# this exact gap. Must be redeclared per environment explicitly.
[[env.production.d1_databases]]
binding = "DB"
database_name = "deangelo-series-orders"
database_id = "89676fb8-49c5-4824-9b1c-3dacc59c0455"

# Preview uses its own separate D1 database so test-mode checkout activity
# cannot commingle with real Production orders or trigger real support emails.
# The reconciliation Worker remains intentionally bound only to the Production
# database via wrangler.reconcile.toml.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "deangelo-series-orders-preview"
database_id = "8703fb27-4d58-40dc-a684-9fa74209c3ff"

[vars]
PRINTIFY_SHOP_ID = "26931439"
PRINTIFY_AUTO_SEND_TO_PRODUCTION = "false"
FROM_EMAIL = "The DeAngelo Series <orders@thedeangeloseries.com>"
SUPPORT_EMAIL = "support@thedeangeloseries.com"
REPLY_TO_EMAIL = "support@thedeangeloseries.com"

# APP_ENV — explicit environment signal for functions/api/create-checkout-session.js's
# checkStripeEnvironmentGuard(). Never inferred from the Stripe key itself;
# this is the one thing that says "this deployment is allowed to use a live
# key" or "this deployment must only ever use a test key."
#
# IMPORTANT: Wrangler's per-environment [env.X.vars] tables REPLACE the
# top-level [vars] block for that environment — they do not merge. Every var
# needed in each environment must be repeated here explicitly, or it silently
# disappears for that environment only (this bit us once already: adding
# [env.production.vars] with only APP_ENV wiped out PRINTIFY_SHOP_ID etc. for
# both Production and Preview until this fix).
[env.production.vars]
APP_ENV = "production"
PRINTIFY_SHOP_ID = "26931439"
PRINTIFY_AUTO_SEND_TO_PRODUCTION = "false"
FROM_EMAIL = "The DeAngelo Series <orders@thedeangeloseries.com>"
SUPPORT_EMAIL = "support@thedeangeloseries.com"
REPLY_TO_EMAIL = "support@thedeangeloseries.com"

[env.preview.vars]
APP_ENV = "preview"
PRINTIFY_SHOP_ID = "26931439"
PRINTIFY_AUTO_SEND_TO_PRODUCTION = "false"
FROM_EMAIL = "The DeAngelo Series <orders@thedeangeloseries.com>"
SUPPORT_EMAIL = "support@thedeangeloseries.com"
REPLY_TO_EMAIL = "support@thedeangeloseries.com"