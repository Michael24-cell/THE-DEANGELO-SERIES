name = "the-deangelo-series"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "deangelo-series-orders"
database_id = "89676fb8-49c5-4824-9b1c-3dacc59c0455"

[vars]
PRINTIFY_SHOP_ID = "26931439"
PRINTIFY_AUTO_SEND_TO_PRODUCTION = "false"
FROM_EMAIL = "The DeAngelo Series <orders@thedeangeloseries.com>"
SUPPORT_EMAIL = "support@thedeangeloseries.com"
REPLY_TO_EMAIL = "support@thedeangeloseries.com"

# APP_ENV — explicit environment signal for functions/api/create-checkout-session.js's
# checkStripeEnvironmentGuard(). Never inferred from the Stripe key itself;
# this is the one thing that says "this deployment is allowed to use a live
# key" or "this deployment must only ever use a test key." Requires a deploy
# of each respective Pages environment to take effect — not yet deployed as
# of this pass (see launch-checklist.md).
[env.production.vars]
APP_ENV = "production"

[env.preview.vars]
APP_ENV = "preview"